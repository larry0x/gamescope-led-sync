[package]
edition = "2024"
name    = "gamescope-led-sync"
version = "0.0.0"

[dependencies]
libc     = "0.2"
pipewire = "0.8"

[profile.release]
codegen-units    = 1
debug            = false
debug-assertions = false
incremental      = false
lto              = true
opt-level        = 3
overflow-checks  = true
panic            = "abort"
rpath            = false
