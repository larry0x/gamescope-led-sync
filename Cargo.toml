[package]
name    = "gamescope-led-sync"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
clap               = { version = "4", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
libc               = "0.2"
pipewire           = "0.10"
thiserror          = "2"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "fmt"] }

[profile.release]
opt-level        = 3
debug            = false
debug-assertions = false
overflow-checks  = true
lto              = true
panic            = "abort"
incremental      = false
codegen-units    = 1
rpath            = false
